name: Django and Docker checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-key-for-django-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: CHROME_BINARY="$(command -v google-chrome)" CHROMEDRIVER="$(command -v chromedriver)" python manage.py test myapp.browser_checks
  docker:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-key-for-docker
      AMBRE_PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 90
      - run: curl --fail --silent http://127.0.0.1:8080/ | grep -F 'Ambre Perfumes'
      - run: docker compose exec -T web python manage.py test
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
