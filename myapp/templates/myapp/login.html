{% extends 'myapp/base.html' %}

{% block title %}Log in | Ambre Perfumes{% endblock %}

{% block content %}
<main class="page">
  <h1>Log in</h1>

  <form class="auth" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="add">Log in</button>
    <p class="switch">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </form>
</main>
{% endblock %}
