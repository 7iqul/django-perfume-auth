<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ambre Perfumes{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Colors and basics ---------- */
:root{--ink:#14101a;--plum:#2a1a3a;--amber:#e8a24a;--blush:#f2d9c9;--mist:#b9a9c9}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--blush);line-height:1.6}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---------- Navbar ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:22px 6vw;transition:background .4s,padding .4s}
nav.solid{background:rgba(20,16,26,.9);backdrop-filter:blur(10px);padding:12px 6vw}
.logo{font-size:1.9rem;text-decoration:none}
nav a.link{color:var(--mist);text-decoration:none;margin-left:28px;transition:color .3s}
nav a.link:hover{color:var(--amber)}
.badge{display:inline-block;min-width:22px;padding:0 7px;margin-left:6px;border-radius:20px;background:var(--amber);color:var(--ink);font-size:.8rem;font-weight:500;text-align:center}

/* ---------- Shared parts ---------- */
.page{padding:130px 6vw 80px}
.page h1{font-size:clamp(2.4rem,5vw,3.8rem);margin-bottom:28px}
.btn,.add{display:inline-block;background:var(--amber);color:var(--ink);padding:12px 30px;border:0;border-radius:40px;font:500 1rem 'DM Sans',sans-serif;text-decoration:none;cursor:pointer;transition:transform .3s,box-shadow .3s}
.btn:hover,.add:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(232,162,74,.35)}
.add:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.link-btn{background:none;border:0;color:var(--mist);font:inherit;text-decoration:underline;cursor:pointer}
.link-btn:hover{color:var(--amber)}
.price{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--amber);font-weight:600}
.size,.brand{color:var(--mist);font-size:.95rem}
.tag{font-size:.85rem;padding:4px 14px;border-radius:20px;background:rgba(232,162,74,.15);color:var(--amber)}
.tag.out{background:rgba(185,169,201,.15);color:var(--mist)}
.cap{transition:transform .4s;transform-box:fill-box;transform-origin:center bottom}
.liquid{filter:hue-rotate(calc(var(--i,0)*40deg))}
nav>div{display:flex;align-items:center}
nav .inline{display:inline;margin-left:28px}
nav .link-btn{text-decoration:none}
nav .hello{color:var(--blush)}
nav a.signup{border:1px solid var(--amber);color:var(--amber);padding:6px 18px;border-radius:30px}
nav a.signup:hover{background:var(--amber);color:var(--ink)}

/* ---------- Login and signup forms ---------- */
.auth{max-width:420px}
.auth p{margin-bottom:18px}
.auth label{display:block;margin-bottom:6px;color:var(--mist)}
.auth input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(242,217,201,.25);background:var(--plum);color:var(--blush);font:inherit}
.auth input:focus{outline:2px solid var(--amber);border-color:transparent}
.auth ul{list-style:none;padding:0}
.auth .helptext{display:block;margin-top:6px;color:var(--mist);font-size:.85rem}
.auth .errorlist{color:#ff9a8a;margin-bottom:8px}
.auth .switch{margin-top:24px;color:var(--mist)}
.auth .switch a{color:var(--amber)}
footer{padding:40px 6vw;color:var(--mist);border-top:1px solid rgba(242,217,201,.1)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
{% block head %}{% endblock %}
</head>
<body>

<!-- Shared bottle color (drawn once, used by every bottle) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c27a"/><stop offset="1" stop-color="#c9772a"/>
    </linearGradient>
  </defs>
</svg>

<nav>
  <a class="logo" href="{% url 'home' %}">Ambre</a>
  <div>
    <a class="link" href="{% url 'home' %}#collection">Collection</a>
    <a class="link" href="{% url 'cart' %}">Cart{% if cart_count %}<span class="badge">{{ cart_count }}</span>{% endif %}</a>
    {% if user.is_authenticated %}
      <span class="link hello">Hi, {{ user.username }}</span>
      <form class="inline" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="link-btn">Log out</button>
      </form>
    {% else %}
      <a class="link" href="{% url 'login' %}">Log in</a>
      <a class="link signup" href="{% url 'signup' %}">Sign up</a>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

<footer>&copy; 2026 Ambre Perfumes</footer>

<script>
// Navbar becomes solid after scrolling a little
const nav = document.querySelector('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('solid', window.scrollY > 60);
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
